<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile | Quick Bytes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
<a class="brand" href="index.html">🍽️ <b>Quick Bytes</b></a>
</header>

<main class="container page">

<div class="page-title">
<a href="index.html">←</a>
<div><span class="eyebrow">ACCOUNT</span><h1>My Profile</h1><p>Your campus ordering details.</p></div>
</div>

<div class="profile-card">
<div class="avatar">👨‍🎓</div>
<div>
<h2 id="profileName">Campus Student</h2>
<p id="profileReg">Register number not added</p>
</div>
</div>

<div class="form-card">

<label>Student Name</label>
<input id="profileNameInput" placeholder="Your name">

<label>Register Number</label>
<input id="profileRegInput" placeholder="Register number">

<label>Default Table</label>
<select id="profileTable">
<option>T-01</option><option>T-02</option><option>T-03</option>
<option>T-04</option><option>T-05</option><option>T-06</option>
<option>T-07</option><option>T-08</option><option>T-09</option>
<option>T-10</option><option>T-11</option><option>T-12</option>
<option>T-13</option><option>T-14</option><option>T-15</option>
</select>

<button id="saveProfile" class="btn primary full">Save Profile</button>

</div>

<div class="feature-grid">
<a class="feature" href="orders.html"><span>📦</span><h3>Order History</h3><p>View your previous orders.</p></a>
<a class="feature" href="feedback.html"><span>⭐</span><h3>Feedback</h3><p>Tell us about your experience.</p></a>
</div>

</main>

<script src="js/app.js"></script>
</body>
</html>
