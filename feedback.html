<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback | Quick Bytes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
<a class="brand" href="index.html">🍽️ <b>Quick Bytes</b></a>
</header>

<main class="container page">

<div class="page-title">
<a href="index.html">←</a>
<div><span class="eyebrow">YOUR VOICE</span><h1>Feedback</h1><p>Help us make Quick Bytes better.</p></div>
</div>

<form id="feedbackForm" class="form-card">

<h2>How was your experience?</h2>

<div class="rating">
<label><input type="radio" name="rating" value="1"> 😕</label>
<label><input type="radio" name="rating" value="2"> 😐</label>
<label><input type="radio" name="rating" value="3" checked> 🙂</label>
<label><input type="radio" name="rating" value="4"> 😄</label>
<label><input type="radio" name="rating" value="5"> 🤩</label>
</div>

<label>Message</label>
<textarea id="feedbackText" required placeholder="Tell us what you liked or what we can improve..."></textarea>

<button class="btn primary full" type="submit">Submit Feedback</button>

</form>

<div id="feedbackSuccess" class="success-card hidden">
<div class="success-icon">✓</div>
<h2>Thank you!</h2>
<p>Your feedback has been saved.</p>
<a class="btn primary" href="index.html">Back to Quick Bytes</a>
</div>

</main>

<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
